services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      MAX_VIDEO_GB: ${MAX_VIDEO_GB:-8}
      ICE_SERVERS: ${ICE_SERVERS:-}
    volumes:
      - videos:/app/.data
  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  videos:
  caddy_data:
  caddy_config:
